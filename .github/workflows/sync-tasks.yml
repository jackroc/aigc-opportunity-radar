name: Sync task directory

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-tasks.yml"
      - "scripts/sync-task-data.mjs"
      - "scripts/sync-task-data.test.mjs"
      - "data/tasks.json"
      - "data/tasks.schema.json"
      - "data/task-platforms.json"
      - "data/task-sources.json"
      - "tasks/feed.xml"
      - "tasks/deadlines.ics"
  pull_request:
    paths:
      - ".github/workflows/sync-tasks.yml"
      - "scripts/sync-task-data.mjs"
      - "scripts/sync-task-data.test.mjs"
      - "data/tasks.json"
      - "data/tasks.schema.json"
      - "data/task-platforms.json"
      - "data/task-sources.json"
      - "tasks/feed.xml"
      - "tasks/deadlines.ics"

permissions:
  contents: read

concurrency:
  group: sync-task-directory
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run task mirror tests
        run: node --test scripts/sync-task-data.test.mjs
      - name: Validate checked-in task mirror
        run: node scripts/sync-task-data.mjs --check

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run task mirror tests
        run: node --test scripts/sync-task-data.test.mjs
      - name: Fetch and validate task data
        run: node scripts/sync-task-data.mjs --sync
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- data/tasks.json data/tasks.schema.json data/task-platforms.json data/task-sources.json tasks/feed.xml tasks/deadlines.ics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit task changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tasks.json data/tasks.schema.json data/task-platforms.json data/task-sources.json tasks/feed.xml tasks/deadlines.ics
          git commit -m "chore(data): sync task directory"
          git push origin HEAD:main
